<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SB3 Web</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SB3 Web</h1>

    <p>Upload and play your Scratch game</p>

    <input
        type="file"
        id="fileInput"
        accept=".sb3"
    >

    <br><br>

    <button id="playButton">
        Play Game
    </button>

    <button id="stopButton">
        Stop
    </button>

    <p id="status"></p>

    <div id="game"></div>


    <!-- TurboWarp Scaffolding -->
    <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.4.0/dist/scaffolding-min.js"></script>

    <!-- Our JavaScript -->
    <script src="script.js"></script>

</body>
</html>
