<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SB3 Web</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="container">

            <h1>SB3 Web</h1>

            <p>
                Play your Scratch projects directly in your browser
            </p>

        </div>

    </header>


    <!-- MAIN -->
    <main class="container">


        <!-- UPLOAD -->
        <section
            class="upload-box"
            id="dropZone"
        >

            <div class="upload-icon">
                📁
            </div>

            <h2>
                Upload your Scratch project
            </h2>

            <p>
                Drag & drop your <strong>.sb3</strong> file here
            </p>

            <div class="or">
                or
            </div>

            <label
                for="fileInput"
                class="browse-btn"
            >
                Browse Files
            </label>

            <input
                type="file"
                id="fileInput"
                accept=".sb3"
                hidden
            >

            <p class="privacy">
                🔒 Your project stays in your browser.
            </p>

        </section>



        <!-- PROJECT INFORMATION -->
        <section
            class="project-info hidden"
            id="projectInfo"
        >

            <div class="section-title">

                <h2>
                    Project
                </h2>

            </div>


            <div class="file-card">

                <div class="file-details">

                    <div class="file-icon">
                        🎮
                    </div>

                    <div>

                        <strong id="fileName">
                            project.sb3
                        </strong>

                        <p id="fileSize">
                            0 KB
                        </p>

                    </div>

                </div>


                <button
                    class="remove-btn"
                    id="removeBtn"
                >
                    Remove
                </button>

            </div>


            <!-- ACTIONS -->
            <div class="actions">

                <button
                    class="play-btn"
                    id="previewBtn"
                >
                    ▶ Play Game
                </button>

                <button
                    class="convert-btn"
                    id="convertBtn"
                >
                    Download Web Game
                </button>

            </div>

        </section>



        <!-- GAME -->
        <section
            class="game-section hidden"
            id="gameSection"
        >

            <div class="game-header">

                <h2>
                    Game
                </h2>

                <button
                    id="stopBtn"
                    class="stop-btn"
                >
                    ■ Stop
                </button>

            </div>


            <div
                id="game"
                class="game-container"
            ></div>

        </section>



        <!-- STATUS -->
        <section
            class="status hidden"
            id="status"
        >

            <span id="statusIcon">
                ℹ️
            </span>

            <p id="statusText">
                Ready
            </p>

        </section>


    </main>



    <!-- FOOTER -->
    <footer>

        <p>
            SB3 Web · Open Source
        </p>

    </footer>



    <!--
        TurboWarp Scaffolding

        This provides the Scratch-compatible
        runtime used to run the SB3 project.
    -->

    <script src="https://unpkg.com/@turbowarp/scaffolding"></script>


    <!-- YOUR JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
