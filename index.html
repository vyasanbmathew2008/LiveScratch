<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SB3 Web</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>SB3 Web</h1>

        <p class="subtitle">
            Upload and play Scratch games
        </p>


        <div class="upload-box">

            <input
                type="file"
                id="fileInput"
                accept=".sb3"
            >

            <p id="fileName">
                No file selected
            </p>

            <button id="playButton">
                ▶ Play Game
            </button>

            <button id="stopButton">
                ■ Stop
            </button>

        </div>


        <p id="status">
            Select an SB3 file.
        </p>


        <div id="game"></div>

    </div>


    <!--
        IMPORTANT:
        Use an exact TurboWarp Scaffolding version.
        v0.2.0 is the current release shown by the
        official repository.
    -->

    <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-min.js"></script>

    <script src="script.js"></script>

</body>

</html>
